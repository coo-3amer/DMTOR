name: Build DMTOR installer

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # libtorrent has Windows builds up to 3.13

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt libtorrent pyinstaller

      - name: Build DMTOR (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name DMTOR --icon assets/app.ico
          --add-data "assets;assets"
          --paths app
          --hidden-import libtorrent
          --collect-all libtorrent
          --collect-submodules yt_dlp
          app/main.py

      - name: Add ffmpeg (HD video + MP3)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Invoke-WebRequest 'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip' -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/DMTOR/ffmpeg.exe

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/DMTOR/DMTOR.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path app/server.py -Pattern 'VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver.0" installer/DMTOR.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem output

      - uses: actions/upload-artifact@v4
        with:
          name: DMTOR-Setup
          path: output/DMTOR-Setup.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest.txt
          if-no-files-found: ignore
