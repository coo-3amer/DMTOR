name: Build MZ-DManager installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # libtorrent has Windows builds up to 3.13

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt libtorrent pyinstaller

      - name: Build MZ-DManager (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name MZ-DManager --icon assets/app.ico
          --add-data "assets;assets"
          --paths app
          --hidden-import libtorrent
          --collect-all libtorrent
          --collect-submodules yt_dlp
          --exclude-module tkinter --exclude-module unittest --exclude-module pydoc
          --exclude-module PySide6.QtNetwork --exclude-module PySide6.QtQml --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtPdf --exclude-module PySide6.QtOpenGL --exclude-module PySide6.QtDBus
          app/main.py

      - name: Trim unused Qt parts
        shell: pwsh
        run: |
          $before = (Get-ChildItem dist/MZ-DManager -Recurse | Measure-Object Length -Sum).Sum
          $q = "dist/MZ-DManager/_internal/PySide6"
          $junk = @("opengl32sw.dll", "Qt6Pdf.dll", "Qt6Qml*.dll", "Qt6Quick*.dll", "Qt6VirtualKeyboard*.dll",
                    "Qt6OpenGL.dll", "Qt6Network.dll", "Qt6DBus.dll", "QtNetwork.pyd", "QtQml.pyd", "QtQuick.pyd",
                    "QtPdf.pyd", "QtOpenGL.pyd", "QtDBus.pyd")
          foreach ($j in $junk) { Get-ChildItem $q -Filter $j -ErrorAction SilentlyContinue | Remove-Item -Force }
          foreach ($d in @("translations", "qml", "plugins/tls", "plugins/networkinformation",
                           "plugins/platforminputcontexts", "plugins/generic", "plugins/egldeviceintegrations")) {
            if (Test-Path "$q/$d") { Remove-Item "$q/$d" -Recurse -Force }
          }
          $after = (Get-ChildItem dist/MZ-DManager -Recurse | Measure-Object Length -Sum).Sum
          Write-Host ("App folder: {0:N1} MB -> {1:N1} MB" -f ($before / 1MB), ($after / 1MB))
          Get-ChildItem dist/MZ-DManager/_internal -Recurse -File | Sort-Object Length -Descending | Select-Object -First 15 |
            ForEach-Object { Write-Host ("{0,8:N1} MB  {1}" -f ($_.Length / 1MB), $_.Name) }

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MZ-DManager/MZ-DManager.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Self-test timed out" }
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Screenshots of the real windows (every theme)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/MZ-DManager/MZ-DManager.exe -ArgumentList '--shots', "$PWD\shots" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Screenshot run timed out" }
          Get-ChildItem shots | Select-Object Name, Length
          if (Test-Path shots/error.txt) { Get-Content shots/error.txt }; if (Test-Path shots/fault.txt) { Get-Content shots/fault.txt }
          if ($p.ExitCode -ne 0) { throw "Screenshot run failed" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        env:
          INSTALLER_PASSWORD: ${{ secrets.INSTALLER_PASSWORD }}
        run: |
          if ($env:INSTALLER_PASSWORD) { Write-Host "Install password: ON" } else { Write-Host "Install password: off (no INSTALLER_PASSWORD secret)" }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path app/features.py -Pattern 'VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver.0" installer/MZ-DManager.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem output | ForEach-Object { Write-Host ("Setup size: {0:N1} MB" -f ($_.Length / 1MB)) }
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release (download page)
        if: contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VER"
          # keep only the newest release: remove older releases together with their tags
          $old = gh release list --limit 100 --json tagName --jq '.[].tagName' | Where-Object { $_ -and $_ -ne $tag }
          foreach ($t in $old) { gh release delete $t --cleanup-tag --yes; Write-Host "removed release $t" }
          $tags = gh api "repos/${{ github.repository }}/tags" --jq '.[].name' | Where-Object { $_ -and $_ -ne $tag }
          foreach ($t in $tags) { gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$t" | Out-Null; Write-Host "removed tag $t" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag output/MZ-DManager-Setup.exe --title "MZ-DManager $env:VER" --notes "Download MZ-DManager-Setup.exe below and double-click it to install."
          } else {
            gh release upload $tag output/MZ-DManager-Setup.exe --clobber
          }

      - name: Remove old build runs
        if: contains(github.event.head_commit.message, '[release]')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ids = gh api "repos/${{ github.repository }}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id'
          foreach ($id in $ids) { gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" 2>$null | Out-Null }
          Write-Host "old runs removed"

      - name: Keep latest installer on the 'download' branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pub | Out-Null
          Copy-Item output/MZ-DManager-Setup.exe pub/
          if (Test-Path shots) { Copy-Item -Recurse shots pub/shots }
          Set-Location pub
          git init -q -b download
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "MZ-DManager $env:VER installer"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" download

      - uses: actions/upload-artifact@v4
        with:
          name: MZ-DManager-Setup
          path: output/MZ-DManager-Setup.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest.txt
          if-no-files-found: ignore
