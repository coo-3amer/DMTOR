name: Build EDENLOAD installer

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"     # libtorrent has Windows builds up to 3.13

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt libtorrent pyinstaller

      - name: Build EDENLOAD (PyInstaller)
        run: >
          pyinstaller --noconfirm --clean --onedir --windowed
          --name EDENLOAD --icon assets/app.ico
          --add-data "assets;assets"
          --paths app
          --hidden-import libtorrent
          --collect-all libtorrent
          --collect-submodules yt_dlp
          app/main.py

      - name: Add ffmpeg (HD video + MP3)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $sources = @(
            'https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip',
            'https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip',
            'https://github.com/GyanD/codexffmpeg/releases/download/7.1/ffmpeg-7.1-essentials_build.zip'
          )
          $ok = $false
          foreach ($u in $sources) {
            for ($try = 1; $try -le 3 -and -not $ok; $try++) {
              try {
                Write-Host "ffmpeg: $u (try $try)"
                Invoke-WebRequest $u -OutFile ffmpeg.zip -TimeoutSec 300
                Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
                $ok = $true
              } catch { Write-Host "  failed: $($_.Exception.Message)"; Start-Sleep -Seconds 10 }
            }
            if ($ok) { break }
          }
          if (-not $ok) { throw "Could not download ffmpeg from any source" }
          $exe = Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $exe.FullName dist/EDENLOAD/ffmpeg.exe

      - name: Self-test the exe
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/EDENLOAD/EDENLOAD.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -PassThru
          if (-not $p.WaitForExit(120000)) { $p.Kill(); throw "Self-test timed out" }
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "Self-test failed" }

      - name: Screenshots of the real windows (every theme)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/EDENLOAD/EDENLOAD.exe -ArgumentList '--shots', "$PWD\shots" -PassThru
          if (-not $p.WaitForExit(180000)) { $p.Kill(); throw "Screenshot run timed out" }
          Get-ChildItem shots | Select-Object Name, Length
          if (Test-Path shots/error.txt) { Get-Content shots/error.txt }
          if ($p.ExitCode -ne 0) { throw "Screenshot run failed" }

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $ver = (Select-String -Path app/features.py -Pattern 'VERSION = "([0-9.]+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$ver.0" installer/EDENLOAD.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem output
          "VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Publish release (download page)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "v$env:VER"
          # keep only the newest release: remove older releases together with their tags
          $old = gh release list --limit 100 --json tagName --jq '.[].tagName' | Where-Object { $_ -and $_ -ne $tag }
          foreach ($t in $old) { gh release delete $t --cleanup-tag --yes; Write-Host "removed release $t" }
          $tags = gh api "repos/${{ github.repository }}/tags" --jq '.[].name' | Where-Object { $_ -and $_ -ne $tag }
          foreach ($t in $tags) { gh api -X DELETE "repos/${{ github.repository }}/git/refs/tags/$t" | Out-Null; Write-Host "removed tag $t" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag output/EDENLOAD-Setup.exe --title "EDENLOAD $env:VER" --notes "Download EDENLOAD-Setup.exe below and double-click it to install."
          } else {
            gh release upload $tag output/EDENLOAD-Setup.exe --clobber
          }

      - name: Remove old build runs
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ids = gh api "repos/${{ github.repository }}/actions/runs?per_page=100" --jq '.workflow_runs[] | select(.id != ${{ github.run_id }}) | .id'
          foreach ($id in $ids) { gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" 2>$null | Out-Null }
          Write-Host "old runs removed"

      - name: Keep latest installer on the 'download' branch
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force pub | Out-Null
          Copy-Item output/EDENLOAD-Setup.exe pub/
          if (Test-Path shots) { Copy-Item -Recurse shots pub/shots }
          Set-Location pub
          git init -q -b download
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -q -m "EDENLOAD $env:VER installer"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" download

      - uses: actions/upload-artifact@v4
        with:
          name: EDENLOAD-Setup
          path: output/EDENLOAD-Setup.exe
          retention-days: 30

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest
          path: selftest.txt
          if-no-files-found: ignore
